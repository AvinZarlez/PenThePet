<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen the Pet - Level Editor</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/game.css">
    <link rel="stylesheet" href="../css/modals.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/editor.css">
</head>
<body>
    <div class="container">
        <h1><span aria-hidden="true">🧩</span> <span data-i18n="editor_title"></span></h1>
        <p class="subtitle" data-i18n="editor_subtitle"></p>

        <div class="editor-controls">
            <label class="editor-field">
                <span data-i18n="editor_label_name"></span>
                <input id="editorLevelName" type="text" maxlength="60">
            </label>
            <label class="editor-field">
                <span data-i18n="editor_label_map_size"></span>
                <select id="editorMapSize"></select>
            </label>
            <div class="editor-field editor-field--tile-palette">
                <span data-i18n="editor_label_tile"></span>
                <div id="editorTileSelector" class="tile-palette" role="group"></div>
            </div>
        </div>

        <div class="editor-actions">
            <button id="editorLoadBtn" class="ctrl-panel" data-i18n="editor_load_btn"></button>
            <button id="editorResetBtn" class="ctrl-panel" data-i18n="btn_reset"></button>
            <button id="editorSolveBtn" class="ctrl-panel" data-i18n="editor_btn_solve"></button>
            <button id="editorToggleSolutionBtn" class="ctrl-panel" style="display:none;" data-i18n="editor_btn_toggle_solution"></button>
            <div id="editorGoalPanel" class="ctrl-panel editor-goal-panel" style="display:none;"></div>
        </div>

        <div id="editorStatus" class="editor-status" role="status" aria-live="polite"></div>

        <div class="grid-container">
            <div id="grid" class="grid"></div>
        </div>

        <details class="editor-instructions">
            <summary data-i18n="editor_instructions_summary"></summary>
            <ul>
                <li data-i18n="editor_instructions_step_1"></li>
                <li data-i18n="editor_instructions_step_2"></li>
                <li data-i18n="editor_instructions_step_3"></li>
                <li data-i18n="editor_instructions_step_4"></li>
                <li data-i18n="editor_instructions_step_5"></li>
                <li data-i18n="editor_instructions_step_6"></li>
            </ul>
        </details>

        <footer>
            <div class="footer-main">
                <div class="footer-text">
                    <p><span data-i18n="about_credits_1_prefix"></span><a href="https://www.AvinZarlez.com"
                            target="_blank" rel="noopener noreferrer" data-i18n="about_credits_1_link"></a></p>
                    <p><a id="githubFooterLink" href="https://github.com/AvinZarlez/penthepet" target="_blank"
                            rel="noopener noreferrer" data-i18n="footer_view_github"></a></p>
                </div>
                <div class="language-selector-container">
                    <select id="languageSelector" class="language-selector" data-i18n-aria="language_aria"
                        aria-label="Select language">
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
        </footer>
    </div>

    <!-- Level Loader Modal -->
    <div id="editorLoadModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="editorLoadModalClose"
                data-i18n-aria="editor_load_modal_close_aria" aria-label="Close level loader">&times;</button>
            <h2 data-i18n="editor_load_modal_title"></h2>

            <!-- Load from map code -->
            <div class="editor-load-section">
                <h3 data-i18n="editor_load_from_code_title"></h3>
                <div class="editor-load-code-row">
                    <input id="editorLoadCodeInput" type="text" class="editor-load-code-input"
                        data-i18n-placeholder="editor_load_code_placeholder">
                    <button id="editorLoadCodeBtn" class="ctrl-panel" data-i18n="editor_load_code_btn"></button>
                </div>
            </div>

            <!-- Browse existing levels -->
            <div class="editor-load-section">
                <h3 data-i18n="editor_load_browse_title"></h3>
                <div id="editorLoadLevelList" class="level-list"></div>
            </div>
        </div>
    </div>

    <script src="../js/config/constants.js"></script>
    <script src="../js/config/config.js"></script>
    <script src="../js/tiles/tileData.js"></script>
    <script src="../js/tiles/TileSvgs.js"></script>
    <script src="../js/common/CookieUtils.js"></script>
    <script src="../js/common/i18n.js"></script>
    <script src="../js/common/MapURLCodec.js"></script>
    <script src="../js/game/PathfindingUtils.js"></script>
    <script src="../js/game/Grid.js"></script>
    <script src="../js/game/GameAnimations.js"></script>
    <script src="../js/editor/LevelEditorCore.js"></script>
    <script src="../js/editor/LevelEditorApp.js"></script>
</body>
</html>
