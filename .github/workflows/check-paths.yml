name: Detect Changed Files

on:
  workflow_call:
    outputs:
      js:
        description: 'Whether JS-related files changed'
        value: ${{ jobs.detect.outputs.js }}
      python:
        description: 'Whether Python files changed'
        value: ${{ jobs.detect.outputs.python }}
      markdown:
        description: 'Whether Markdown files changed'
        value: ${{ jobs.detect.outputs.markdown }}
      yaml:
        description: 'Whether YAML files changed'
        value: ${{ jobs.detect.outputs.yaml }}
      tests:
        description: 'Whether test-related files changed'
        value: ${{ jobs.detect.outputs.tests }}
      test-webapp:
        description: 'Whether webapp tests should run'
        value: ${{ jobs.detect.outputs.test-webapp }}
      test-generation:
        description: 'Whether generation tests should run'
        value: ${{ jobs.detect.outputs.test-generation }}
      test-editor:
        description: 'Whether level-editor tests should run'
        value: ${{ jobs.detect.outputs.test-editor }}

jobs:
  detect:
    name: Detect Changed Files
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      js: ${{ steps.filter.outputs.js }}
      python: ${{ steps.filter.outputs.python }}
      markdown: ${{ steps.filter.outputs.markdown }}
      yaml: ${{ steps.filter.outputs.yaml }}
      tests: ${{ steps.filter.outputs.tests }}
      test-webapp: ${{ steps.filter.outputs.test-webapp }}
      test-generation: ${{ steps.filter.outputs.test-generation }}
      test-editor: ${{ steps.filter.outputs.test-editor }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "js=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "markdown=true" >> "$GITHUB_OUTPUT"
            echo "yaml=true" >> "$GITHUB_OUTPUT"
            echo "tests=true" >> "$GITHUB_OUTPUT"
            echo "test-webapp=true" >> "$GITHUB_OUTPUT"
            echo "test-generation=true" >> "$GITHUB_OUTPUT"
            echo "test-editor=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            # Branches in this repo always have at least one parent commit.
            BASE=$(git rev-parse HEAD^1)
            HEAD="${{ github.sha }}"
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          echo "js=$(echo "$CHANGED" | grep -qE \
            '(^js/|^scripts/.*\.js$|^test/.*\.js$|^eslint\.config\.mjs$|^package(-lock)?\.json$)' \
            && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$(echo "$CHANGED" | grep -qE \
            '(^scripts/solver/|^ruff\.toml$)' \
            && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "markdown=$(echo "$CHANGED" | grep -qE \
            '(\.md$|\.markdownlint-cli2\.jsonc$)' \
            && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "yaml=$(echo "$CHANGED" | grep -qE \
            '(^\.github/.*\.(yml|yaml)$|^\.yamllint\.yml$)' \
            && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tests=$(echo "$CHANGED" | grep -qE \
            '(^js/|^scripts/|^test/|^package(-lock)?\.json$)' \
            && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # Shared modules used by multiple projects (webapp, generation, level editor).
          SHARED_PATTERN='(^js/common/|^js/config/|^js/tiles/|^js/game/Grid\.js$|^js/game/PathfindingUtils\.js$|^js/game/GameAnimations\.js$|^package(-lock)?\.json$)'
          GENERATION_PATTERN='(^scripts/|^js/generation/|^test/generation/)'
          EDITOR_PATTERN='(^level-editor/|^css/editor\.css$|^js/editor/|^test/webapp/editor/|^test/generation/levelEditorMap\.test\.js$|^test/generation/level-editor-server\.test\.js$)'

          SHARED_CHANGED=$(echo "$CHANGED" | grep -qE "$SHARED_PATTERN" && echo true || echo false)
          WEBAPP_CHANGED=false
          if echo "$CHANGED" | grep -qE '(^index\.html$|^js/Menu\.js$|^js/main\.js$)'; then
            WEBAPP_CHANGED=true
          fi
          # Webapp suite excludes shared/editor-only files here because shared
          # changes are already covered by SHARED_CHANGED fanout logic below.
          if echo "$CHANGED" | grep -qE '^js/game/'; then
            if echo "$CHANGED" | grep -E '^js/game/' | grep -qEv '^js/game/(Grid\.js|PathfindingUtils\.js|GameAnimations\.js)$'; then
              WEBAPP_CHANGED=true
            fi
          fi
          if echo "$CHANGED" | grep -qE '^css/'; then
            if echo "$CHANGED" | grep -E '^css/' | grep -qEv '^css/editor\.css$'; then
              WEBAPP_CHANGED=true
            fi
          fi
          if echo "$CHANGED" | grep -qE '^test/webapp/'; then
            if echo "$CHANGED" | grep -E '^test/webapp/' | grep -qEv '^test/webapp/editor/'; then
              WEBAPP_CHANGED=true
            fi
          fi
          GENERATION_CHANGED=$(echo "$CHANGED" | grep -qE "$GENERATION_PATTERN" && echo true || echo false)
          EDITOR_CHANGED=$(echo "$CHANGED" | grep -qE "$EDITOR_PATTERN" && echo true || echo false)

          if [ "$SHARED_CHANGED" = "true" ] || [ "$WEBAPP_CHANGED" = "true" ]; then
            echo "test-webapp=true" >> "$GITHUB_OUTPUT"
          else
            echo "test-webapp=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SHARED_CHANGED" = "true" ] || [ "$GENERATION_CHANGED" = "true" ]; then
            echo "test-generation=true" >> "$GITHUB_OUTPUT"
          else
            echo "test-generation=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SHARED_CHANGED" = "true" ] || [ "$EDITOR_CHANGED" = "true" ]; then
            echo "test-editor=true" >> "$GITHUB_OUTPUT"
          else
            echo "test-editor=false" >> "$GITHUB_OUTPUT"
          fi
