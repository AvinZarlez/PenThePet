name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-paths:
    name: Detect Changed Files
    uses: ./.github/workflows/check-paths.yml
    permissions:
      contents: read

  lint-js:
    name: Lint JavaScript
    needs: check-paths
    if: needs.check-paths.outputs.js == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  lint-python:
    name: Lint Python
    needs: check-paths
    if: needs.check-paths.outputs.python == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check scripts/solver/

  lint-markdown:
    name: Lint Markdown
    needs: check-paths
    if: needs.check-paths.outputs.markdown == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint
        run: npm run lint:markdown

  lint-yaml:
    name: Lint YAML
    needs: check-paths
    if: needs.check-paths.outputs.yaml == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: npm run lint:yaml

  lint:
    name: Lint
    needs: [check-paths, lint-js, lint-python, lint-markdown, lint-yaml]
    if: always()
    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Check lint results
        run: |
          for result in \
              "${{ needs.check-paths.result }}" \
              "${{ needs.lint-js.result }}" \
              "${{ needs.lint-python.result }}" \
              "${{ needs.lint-markdown.result }}" \
              "${{ needs.lint-yaml.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Lint pipeline failed or was cancelled."
              exit 1
            fi
          done
          echo "All lint checks passed (or were not required)."
