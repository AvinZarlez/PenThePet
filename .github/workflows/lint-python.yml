name: Lint Python

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'scripts/solver/**'
      - 'ruff.toml'
  pull_request:
    branches: '**'
    paths:
      - 'scripts/solver/**'
      - 'ruff.toml'

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check scripts/solver/
