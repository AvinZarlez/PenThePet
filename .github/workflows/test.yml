name: Test

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-paths:
    name: Detect Changed Files
    uses: ./.github/workflows/check-paths.yml
    permissions:
      contents: read

  test-webapp:
    name: Test Webapp
    needs: check-paths
    if: needs.check-paths.outputs.tests == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run webapp tests
        run: npm run test:webapp

  test-generation:
    name: Test Level Generation
    needs: check-paths
    if: needs.check-paths.outputs.tests == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install -r scripts/solver/requirements.txt

      - name: Run level generation tests
        run: npm run test:generation

  coverage:
    name: Full Test Suite & Coverage
    runs-on: ubuntu-latest
    needs: [test-webapp, test-generation]

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install -r scripts/solver/requirements.txt

      - name: Run all tests with coverage
        run: npm test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Generate test report
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "const summary=JSON.parse(require('fs').readFileSync('./coverage/coverage-summary.json','utf8')); console.log(summary.total.lines.pct)")
            echo "### Code Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let coverage = 'N/A';
            try {
              const coverageData = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
              const total = coverageData.total;
              coverage = `${total.lines.pct}%`;
            } catch (error) {
              console.log('Coverage data not found');
            }

            const body = `## Test Results

            ### Code Coverage: ${coverage}

            - ✅ Linting: Passed
            - ✅ Tests: Passed

            **Node Version:** 20.x
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  test:
    name: Test
    needs: [check-paths, test-webapp, test-generation, coverage]
    if: always()
    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Check test results
        run: |
          for result in \
              "${{ needs.check-paths.result }}" \
              "${{ needs.test-webapp.result }}" \
              "${{ needs.test-generation.result }}" \
              "${{ needs.coverage.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Test pipeline failed or was cancelled."
              exit 1
            fi
          done
          echo "All test checks passed (or were not required)."
