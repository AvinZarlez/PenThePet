name: Generate Daily Map

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date for the map (YYYY-MM-DD)'
        required: true
        default: ''
      size:
        description: 'Map size (7, 9, 11, etc.)'
        required: true
        default: '9'
        type: choice
        options:
          - '7'
          - '9'
          - '11'
          - '13'
          - '15'
          - '17'
          - '19'
          - '21'
      max_walls:
        description: 'Maximum walls to try (default: 15)'
        required: false
        default: '15'

jobs:
  generate-map:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate map
        id: generate
        run: |
          echo "Generating map for ${{ github.event.inputs.date }} (size: ${{ github.event.inputs.size }})"
          node scripts/generate-single-map.js \
            --date "${{ github.event.inputs.date }}" \
            --size "${{ github.event.inputs.size }}" \
            --max-walls "${{ github.event.inputs.max_walls }}"
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet maps.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add maps.json
          git commit -m "Add daily map for ${{ github.event.inputs.date }}"
          git push
          
      - name: No changes
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "No changes to maps.json - map may already exist or generation failed"
          exit 1
