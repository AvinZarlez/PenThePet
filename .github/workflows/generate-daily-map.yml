name: Generate Daily Map

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date for the map (YYYY-MM-DD). Leave empty to auto-assign the next date.'
        required: false
        default: ''
      size:
        description: 'Map size (7, 9, 11, etc.)'
        required: true
        default: '9'
        type: choice
        options:
          - '7'
          - '9'
          - '11'
          - '13'
          - '15'
          - '17'
          - '19'
          - '21'

jobs:
  generate-map:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          npm install
          pip install -r scripts/solver/requirements.txt
        
      - name: Generate map
        id: generate
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          SIZE_ARG="${{ github.event.inputs.size }}"
          
          if [ -n "$DATE_ARG" ]; then
            echo "Generating map for ${DATE_ARG} (size: ${SIZE_ARG})"
            node scripts/generate-single-map.js --date "${DATE_ARG}" --size "${SIZE_ARG}"
          else
            echo "Generating map with auto-assigned date (size: ${SIZE_ARG})"
            node scripts/generate-single-map.js --size "${SIZE_ARG}"
          fi
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet maps.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add maps.json
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -n "$DATE_ARG" ]; then
            git commit -m "Add daily map for ${DATE_ARG}"
          else
            git commit -m "Add new daily map (auto-assigned date)"
          fi
          git push
          
      - name: No changes
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "No changes to maps.json - map may already exist or generation failed"
          exit 1
