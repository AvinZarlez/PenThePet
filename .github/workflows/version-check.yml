name: Version Check

on:
  pull_request:
    branches:
      - main

jobs:
  version-check:
    name: Require version bump
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version was bumped
        run: |
          BASE_VERSION=$(git show origin/main:package.json \
            | node -e \
              "const d=require('fs').readFileSync('/dev/stdin','utf8');console.log(JSON.parse(d).version)")
          PR_VERSION=$(node -e "console.log(require('./package.json').version)")

          echo "Base version (main): ${BASE_VERSION}"
          echo "PR version:          ${PR_VERSION}"

          if [ "${BASE_VERSION}" = "${PR_VERSION}" ]; then
            echo ""
            echo "::error::Version not bumped. Update \"version\" in package.json before merging."
            echo "  Current version on main: ${BASE_VERSION}"
            echo "  Use MINOR (x.Y.0) for features/content, MAJOR (X.0.0) for breaking changes,"
            echo "  or PATCH (x.y.Z) for automated map additions via the map pipelines."
            exit 1
          fi

          echo "✅ Version bumped: ${BASE_VERSION} → ${PR_VERSION}"
