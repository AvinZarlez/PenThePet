name: Lint JavaScript

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'js/**'
      - 'scripts/**/*.js'
      - 'test/**/*.js'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: '**'
    paths:
      - 'js/**'
      - 'scripts/**/*.js'
      - 'test/**/*.js'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
