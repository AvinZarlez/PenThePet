name: PR Screenshot

on:
  pull_request:
    branches: '**'
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      
      - name: Install Playwright
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium
      
      - name: Start local server
        run: |
          python3 -m http.server 8080 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Server is ready!"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
        working-directory: ${{ github.workspace }}
      
      - name: Take screenshot
        run: |
          npx playwright screenshot http://localhost:8080 screenshot.png --full-page
      
      - name: Stop server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi
      
      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshot
          path: screenshot.png
          retention-days: 30
      
      - name: Comment PR with instructions
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const body = `## 📸 Screenshot Preview

A screenshot of the game after applying PR changes has been generated!

**How to view:**
1. Visit the [workflow run](${runUrl})
2. Scroll to the bottom to find "Artifacts"
3. Download the \`pr-screenshot\` artifact
4. Extract and view \`screenshot.png\`

**Note:** Screenshot shows the game loaded in a headless browser after all changes are applied.

---
*This screenshot is automatically generated for every PR to help reviewers visualize UI changes.*`;
            
            // Find existing screenshot comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('📸 Screenshot Preview')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
