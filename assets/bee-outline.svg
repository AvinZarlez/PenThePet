<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <!-- Red silhouette outline for bee, scaled ~1.1x from center (25,25) -->
  <!-- Head -->
  <circle cx="25" cy="17.3" r="5.5" fill="#CC0000"/>
  <!-- Antennae tips -->
  <circle cx="18.4" cy="6.3" r="1.65" fill="#CC0000"/>
  <circle cx="31.6" cy="6.3" r="1.65" fill="#CC0000"/>
  <!-- Antennae lines -->
  <line x1="22.8" y1="12.9" x2="18.4" y2="6.3" stroke="#CC0000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="27.2" y1="12.9" x2="31.6" y2="6.3" stroke="#CC0000" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Wings -->
  <ellipse cx="15.1" cy="21.7" rx="6.6" ry="4.4" fill="#CC000066" transform="rotate(-20,15.1,21.7)"/>
  <ellipse cx="34.9" cy="21.7" rx="6.6" ry="4.4" fill="#CC000066" transform="rotate(20,34.9,21.7)"/>
  <!-- Body -->
  <ellipse cx="25" cy="28.3" rx="11" ry="8.8" fill="#CC0000"/>
  <!-- Stinger -->
  <polygon points="25,37.1 22.8,41.5 27.2,41.5" fill="#CC0000"/>
</svg>
