<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <!-- Red silhouette outline for bee, scaled 1.35x from center (25,25) -->
  <!-- Head -->
  <circle cx="25" cy="15.6" r="6.8" fill="#CC0000"/>
  <!-- Antennae tips (cy raised slightly from mathematical 2.1 to avoid top-edge clipping) -->
  <circle cx="16.9" cy="3.0" r="2.0" fill="#CC0000"/>
  <circle cx="33.1" cy="3.0" r="2.0" fill="#CC0000"/>
  <!-- Antennae lines -->
  <line x1="22.3" y1="10.2" x2="16.9" y2="3.0" stroke="#CC0000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27.7" y1="10.2" x2="33.1" y2="3.0" stroke="#CC0000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Wings -->
  <ellipse cx="12.9" cy="21.0" rx="8.1" ry="5.4" fill="#CC000066" transform="rotate(-20,12.9,21.0)"/>
  <ellipse cx="37.2" cy="21.0" rx="8.1" ry="5.4" fill="#CC000066" transform="rotate(20,37.2,21.0)"/>
  <!-- Body -->
  <ellipse cx="25" cy="29.1" rx="13.5" ry="10.8" fill="#CC0000"/>
  <!-- Stinger -->
  <polygon points="25,39.9 22.3,45.3 27.7,45.3" fill="#CC0000"/>
</svg>
