<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    PenThePet App Icon — Fence & Dog House
    A dog house inside a wooden fenced pen on a grassy background.
    Designed to look great at 192 × 192 and 512 × 512 sizes.
    Maskable safe zone: innermost 80 × 80 centred area (x 10–90, y 10–90).
  -->

  <!-- Background: game green -->
  <rect width="100" height="100" rx="16" fill="#5cb85c"/>

  <!-- Grass ground (lower third) -->
  <rect x="0" y="68" width="100" height="32" fill="#4caf50"/>

  <!-- Subtle grass blades -->
  <path d="M15 95 Q14 88 16 82" stroke="#45a049" stroke-width="1.5"
        fill="none" stroke-linecap="round"/>
  <path d="M85 95 Q86 88 84 82" stroke="#45a049" stroke-width="1.5"
        fill="none" stroke-linecap="round"/>

  <!-- Dog house: roof -->
  <polygon points="22,46 50,20 78,46" fill="#8b4513"/>
  <line x1="22" y1="46" x2="78" y2="46" stroke="#6d3410" stroke-width="1.5"/>
  <!-- Roof ridge highlights -->
  <path d="M33,37 L50,21 L67,37" fill="none" stroke="#a0522d"
        stroke-width="1.5" opacity="0.45"/>

  <!-- Dog house: body (rounded top corners, flat bottom) -->
  <path d="M30,72 L30,50 Q30,46 34,46 L66,46 Q70,46 70,50 L70,72 Z"
        fill="#c0855a"/>
  <!-- Right-side shading for depth -->
  <path d="M65,46 Q70,46 70,50 L70,72 L65,72 Z" fill="#8b5a33" opacity="0.5"/>
  <!-- Wood grain detail -->
  <path d="M33,53 Q50,51 67,53" stroke="#a0704a" stroke-width="1"
        fill="none" opacity="0.35"/>

  <!-- Dog house: large arch entrance -->
  <path d="M38,72 L38,58 Q38,47 50,47 Q62,47 62,58 L62,72 Z" fill="#2a1a0e"/>
  <!-- Arch frame highlight -->
  <path d="M38,58 Q38,49 50,49 Q62,49 62,58" fill="none"
        stroke="#5a3820" stroke-width="1.5" opacity="0.5"/>

  <!-- Fence posts (2 outer posts, drawn behind rails) -->
  <rect x="12" y="56" width="10" height="38" rx="2" fill="#6d4c41"/>
  <rect x="78" y="56" width="10" height="38" rx="2" fill="#6d4c41"/>
  <!-- Post shading -->
  <rect x="19" y="56" width="3" height="38" rx="1" fill="#5d4037" opacity="0.4"/>
  <rect x="85" y="56" width="3" height="38" rx="1" fill="#5d4037" opacity="0.4"/>

  <!-- Fence rails (in front of dog house, suggesting depth) -->
  <rect x="10" y="60" width="80" height="8" rx="2" fill="#8d6e63"/>
  <rect x="10" y="74" width="80" height="8" rx="2" fill="#8d6e63"/>
  <!-- Rail top highlights -->
  <rect x="10" y="60" width="80" height="2" rx="1" fill="#a1887f" opacity="0.6"/>
  <rect x="10" y="74" width="80" height="2" rx="1" fill="#a1887f" opacity="0.6"/>
</svg>
