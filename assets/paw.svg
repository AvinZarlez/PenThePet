<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <!-- Custom paw print icon -->
  <g fill="#5d4037" opacity="0.85">
    <!-- Main pad (heart-like bottom pad) -->
    <ellipse cx="15" cy="19" rx="6" ry="5"/>
    <!-- Toe pads (top four) -->
    <ellipse cx="8" cy="10" rx="3" ry="3.5"/>
    <ellipse cx="15" cy="7" rx="3" ry="3.5"/>
    <ellipse cx="22" cy="10" rx="3" ry="3.5"/>
    <!-- Fourth smaller toe -->
    <ellipse cx="10" cy="14" rx="2.5" ry="2.5" transform="rotate(-15 10 14)"/>
    <ellipse cx="20" cy="14" rx="2.5" ry="2.5" transform="rotate(15 20 14)"/>
  </g>
  <!-- Subtle highlight on main pad -->
  <ellipse cx="14" cy="18" rx="2.5" ry="2" fill="#8d6e63" opacity="0.3"/>
</svg>
