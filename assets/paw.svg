<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <!-- Custom paw print icon - 4 toe beans + 1 main pad -->
  <g fill="#4e342e">
    <!-- Four toe beans at the top -->
    <ellipse cx="8.5" cy="6.5" rx="3" ry="3.8"/>
    <ellipse cx="15" cy="4.5" rx="2.8" ry="3.5"/>
    <ellipse cx="21.5" cy="6.5" rx="3" ry="3.8"/>
    <ellipse cx="15" cy="11" rx="2.2" ry="2.5"/>
    <!-- Main pad (large, rounded triangle shape at bottom) -->
    <path d="M7,17 Q6,24 11,27 Q15,29 19,27 Q24,24 23,17 Q20,13 15,14 Q10,13 7,17 Z"/>
  </g>
  <!-- Highlight on main pad -->
  <path d="M9,18 Q9,23 13,25 Q15,26 17,25 Q21,23 21,18 Q19,15 15,16 Q11,15 9,18 Z" fill="#6d4c41" opacity="0.35"/>
</svg>
