<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    PenThePet Favicon — Wooden Fence
    Dark background matching the game's CSS colour theme.
    Designed to be legible at 16 × 16 px and above.
  -->

  <!-- Background: dark (#1c1e30), matching the game CSS theme -->
  <rect width="32" height="32" rx="5" fill="#1c1e30"/>

  <!-- Fence posts (3 vertical posts) -->
  <rect x="2"  y="5" width="6" height="23" rx="1" fill="#6d4c41"/>
  <rect x="13" y="3" width="6" height="25" rx="1" fill="#6d4c41"/>
  <rect x="24" y="5" width="6" height="23" rx="1" fill="#6d4c41"/>
  <!-- Post right-edge shading -->
  <rect x="6"  y="5" width="2" height="23" rx="1" fill="#5d4037" opacity="0.5"/>
  <rect x="17" y="3" width="2" height="25" rx="1" fill="#5d4037" opacity="0.5"/>
  <rect x="28" y="5" width="2" height="23" rx="1" fill="#5d4037" opacity="0.5"/>

  <!-- Horizontal rails (2 rails) -->
  <rect x="1" y="9"  width="30" height="5" rx="1" fill="#8d6e63"/>
  <rect x="1" y="19" width="30" height="5" rx="1" fill="#8d6e63"/>
  <!-- Rail top highlights -->
  <rect x="1" y="9"  width="30" height="1.5" rx="0.75" fill="#a1887f" opacity="0.7"/>
  <rect x="1" y="19" width="30" height="1.5" rx="0.75" fill="#a1887f" opacity="0.7"/>
</svg>
