<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <pattern id="wallPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Fence base -->
      <rect width="50" height="50" fill="#8d6e63"/>
      <!-- Wooden planks - horizontal -->
      <rect x="0" y="0" width="50" height="24" fill="#a1887f" rx="1"/>
      <rect x="0" y="26" width="50" height="24" fill="#8d6e63" rx="1"/>
      <!-- Plank divider line -->
      <line x1="0" y1="25" x2="50" y2="25" stroke="#5d4037" stroke-width="1.5"/>
      <!-- Vertical fence posts -->
      <rect x="3" y="0" width="8" height="50" fill="#6d4c41" rx="2"/>
      <rect x="39" y="0" width="8" height="50" fill="#6d4c41" rx="2"/>
      <!-- Post highlights -->
      <rect x="4" y="2" width="2" height="46" fill="#8d6e63" opacity="0.5" rx="1"/>
      <rect x="40" y="2" width="2" height="46" fill="#8d6e63" opacity="0.5" rx="1"/>
      <!-- Wood grain on planks -->
      <path d="M14 6 Q20 5 26 7" stroke="#795548" stroke-width="0.7" fill="none" opacity="0.4"/>
      <path d="M14 14 Q22 13 30 15" stroke="#795548" stroke-width="0.7" fill="none" opacity="0.3"/>
      <path d="M14 32 Q22 31 30 33" stroke="#795548" stroke-width="0.7" fill="none" opacity="0.4"/>
      <path d="M14 40 Q20 39 28 41" stroke="#795548" stroke-width="0.7" fill="none" opacity="0.3"/>
      <!-- Nail details -->
      <circle cx="7" cy="12" r="1.5" fill="#5d4037" opacity="0.6"/>
      <circle cx="7" cy="37" r="1.5" fill="#5d4037" opacity="0.6"/>
      <circle cx="43" cy="12" r="1.5" fill="#5d4037" opacity="0.6"/>
      <circle cx="43" cy="37" r="1.5" fill="#5d4037" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="50" height="50" fill="url(#wallPattern)"/>
</svg>
