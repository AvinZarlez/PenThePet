<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <pattern id="waterPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Deep water base -->
      <rect width="50" height="50" fill="#2196f3"/>
      <!-- Wave highlights -->
      <path d="M0 12 Q8 8 16 12 Q24 16 32 12 Q40 8 50 12" stroke="#4fc3f7" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M0 24 Q10 20 20 24 Q30 28 40 24 Q45 22 50 24" stroke="#4fc3f7" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
      <path d="M0 36 Q8 32 16 36 Q24 40 32 36 Q40 32 50 36" stroke="#4fc3f7" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
      <path d="M0 48 Q12 44 24 48 Q36 52 50 48" stroke="#4fc3f7" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>
      <!-- Shimmer spots -->
      <ellipse cx="10" cy="8" rx="3" ry="1.5" fill="#bbdefb" opacity="0.3"/>
      <ellipse cx="35" cy="20" rx="4" ry="1.5" fill="#bbdefb" opacity="0.25"/>
      <ellipse cx="15" cy="32" rx="3" ry="1" fill="#bbdefb" opacity="0.2"/>
      <ellipse cx="42" cy="42" rx="3" ry="1.5" fill="#bbdefb" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="50" height="50" fill="url(#waterPattern)"/>
</svg>
