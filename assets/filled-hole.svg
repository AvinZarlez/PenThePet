<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <radialGradient id="fhGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2d1a"/>
      <stop offset="70%" stop-color="#4a3728"/>
      <stop offset="100%" stop-color="#6d4c41"/>
    </radialGradient>
  </defs>
  <!-- Earthy rim (same as hole) -->
  <rect width="50" height="50" fill="#6d4c41"/>
  <!-- Hole shape still visible, but lighter (filled, not empty void) -->
  <ellipse cx="25" cy="25" rx="20" ry="18" fill="url(#fhGrad)"/>
  <ellipse cx="25" cy="25" rx="20" ry="18" fill="none" stroke="#5d4037" stroke-width="2"/>
  <!-- Wall plank shoved into the hole -->
  <rect x="8" y="14" width="34" height="10" fill="#a1887f" rx="2"/>
  <rect x="8" y="26" width="34" height="10" fill="#8d6e63" rx="2"/>
  <line x1="8" y1="24.5" x2="42" y2="24.5" stroke="#5d4037" stroke-width="1.5"/>
  <!-- Fence post stubs -->
  <rect x="12" y="12" width="6" height="26" fill="#6d4c41" rx="1.5"/>
  <rect x="32" y="12" width="6" height="26" fill="#6d4c41" rx="1.5"/>
  <!-- Post highlights -->
  <rect x="13" y="13" width="1.5" height="24" fill="#8d6e63" opacity="0.5" rx="0.5"/>
  <rect x="33" y="13" width="1.5" height="24" fill="#8d6e63" opacity="0.5" rx="0.5"/>
  <!-- Nails -->
  <circle cx="15" cy="19" r="1.2" fill="#5d4037" opacity="0.7"/>
  <circle cx="15" cy="31" r="1.2" fill="#5d4037" opacity="0.7"/>
  <circle cx="35" cy="19" r="1.2" fill="#5d4037" opacity="0.7"/>
  <circle cx="35" cy="31" r="1.2" fill="#5d4037" opacity="0.7"/>
  <!-- Dirt rim texture -->
  <circle cx="8" cy="10" r="2" fill="#795548" opacity="0.5"/>
  <circle cx="42" cy="10" r="1.5" fill="#795548" opacity="0.4"/>
  <circle cx="6" cy="40" r="1.5" fill="#795548" opacity="0.4"/>
  <circle cx="44" cy="40" r="1.5" fill="#795548" opacity="0.5"/>
</svg>
