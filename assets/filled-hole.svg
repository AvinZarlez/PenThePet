<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <pattern id="filledHolePattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Packed earth base -->
      <rect width="50" height="50" fill="#8d6e63"/>
      <!-- Dirt texture -->
      <circle cx="10" cy="15" r="3" fill="#795548" opacity="0.5"/>
      <circle cx="35" cy="10" r="4" fill="#6d4c41" opacity="0.4"/>
      <circle cx="20" cy="35" r="3.5" fill="#795548" opacity="0.4"/>
      <circle cx="40" cy="38" r="3" fill="#6d4c41" opacity="0.5"/>
      <circle cx="8" cy="40" r="2" fill="#a1887f" opacity="0.3"/>
      <circle cx="30" cy="22" r="2.5" fill="#5d4037" opacity="0.3"/>
      <!-- Subtle cracks showing fill -->
      <path d="M12 25 Q18 23 25 25 Q32 27 38 25" stroke="#6d4c41" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M15 15 Q20 13 25 14" stroke="#6d4c41" stroke-width="0.8" fill="none" opacity="0.4"/>
      <path d="M28 35 Q33 37 40 35" stroke="#6d4c41" stroke-width="0.8" fill="none" opacity="0.4"/>
      <!-- Small pebbles -->
      <circle cx="15" cy="28" r="1.5" fill="#a1887f" opacity="0.5"/>
      <circle cx="38" cy="18" r="1" fill="#a1887f" opacity="0.4"/>
      <circle cx="25" cy="42" r="1.5" fill="#a1887f" opacity="0.4"/>
      <circle cx="8" cy="8" r="1" fill="#bcaaa4" opacity="0.3"/>
      <circle cx="45" cy="30" r="1" fill="#bcaaa4" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="50" height="50" fill="url(#filledHolePattern)"/>
</svg>
