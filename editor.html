<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Editor - Pen the Pet</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <div class="container">
        <h1><span aria-hidden="true">🎨</span> Level Editor</h1>
        <p class="subtitle">Create custom levels for Pen the Pet</p>
        
        <!-- Controls Section -->
        <div class="controls-section">
            <!-- Grid Size Slider -->
            <div class="control-group">
                <label for="gridSizeSlider">Grid Size: <span id="gridSizeValue">9</span>x<span id="gridSizeValue2">9</span></label>
                <input type="range" id="gridSizeSlider" min="5" max="21" value="9" step="1">
            </div>
            
            <!-- Tile Selection -->
            <div class="control-group">
                <label for="tileSelect">Tile Type:</label>
                <select id="tileSelect">
                    <option value="grass">Grass</option>
                    <option value="water">Water</option>
                    <option value="home">Home</option>
                </select>
            </div>
            
            <!-- Level Settings -->
            <div class="control-group">
                <label for="levelName">Level Name:</label>
                <input type="text" id="levelName" placeholder="My Awesome Level" maxlength="50">
            </div>
            
            <div class="control-group">
                <label for="maxWalls">Max Walls:</label>
                <input type="number" id="maxWalls" min="1" max="15" value="10" step="1">
            </div>
            
            <!-- Action Buttons -->
            <div class="control-group button-group">
                <button id="clearBtn" class="btn btn-warning">Clear Grid</button>
                <button id="saveBtn" class="btn btn-primary">Save Level</button>
            </div>
        </div>
        
        <!-- Grid Container -->
        <div id="gridContainer" class="grid-container"></div>
        
        <!-- Export Section (Initially Hidden) -->
        <div id="exportSection" class="export-section" style="display: none;">
            <h3>Level Data</h3>
            <p class="export-info">Copy this data to use in your solver tool:</p>
            <textarea id="exportData" readonly></textarea>
            <button id="copyBtn" class="btn btn-success">Copy to Clipboard</button>
            <div id="copyFeedback" class="copy-feedback"></div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/LevelEditor.js"></script>
</body>
</html>
