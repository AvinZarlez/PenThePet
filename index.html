<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Pen the Pet - A Logic Puzzle Game</title>

    <!-- Favicon (SVG — scalable, works in all modern browsers) -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <!-- Web-app manifest: enables "Add to Home Screen" on Android / Chrome.
         The manifest references assets/icon.svg as a scalable PWA icon.
         Note for artists: replace assets/favicon.svg and assets/icon.svg with
         commissioned artwork (keep the same viewBox dimensions).
         For iOS home-screen support, also export a 180 × 180 PNG from
         assets/icon.svg and add:
           <link rel="apple-touch-icon" href="assets/apple-touch-icon.png"> -->
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#5cb85c">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/menu.css">
</head>
<body>
    <div class="container">
        <!-- Menu Button -->
        <button id="menuBtn" class="menu-btn" data-i18n-aria="btn_menu_open" aria-label="Open menu">☰</button>

        <!-- Language Selector -->
        <div class="language-selector-container">
            <select id="languageSelector" class="language-selector" data-i18n-aria="language_aria" aria-label="Select language">
                <option value="en">English</option>
            </select>
        </div>

        <!-- Cloud Sync UI (hidden until Firebase is configured) -->
        <div id="cloudSyncBar" class="cloud-sync-bar">
            <button id="cloudSyncLoginBtn" class="cloud-sync-login-btn" style="display: none;"
                    data-i18n="cloud_sync_sign_in_btn"
                    onclick="CloudSync.openAuthModal()"></button>
            <div id="cloudSyncUserInfo" class="cloud-sync-user-info" style="display: none;">
                <span id="cloudSyncUserEmail" class="cloud-sync-email"></span>
                <span id="cloudSyncStatus" class="cloud-sync-status" style="display: none;"></span>
                <button class="cloud-sync-signout-btn" data-i18n="cloud_sync_sign_out_btn" onclick="CloudSync.handleSignOut()"></button>
            </div>
        </div>

        <h1><span aria-hidden="true">🐾</span> Pen the Pet</h1>
        <p class="subtitle" data-i18n="subtitle"></p>

        <div class="map-info">
            <div class="map-info-item">
                <span class="map-info-label" data-i18n="label_day"></span>
                <span id="mapDay" class="map-info-value">1</span>
            </div>
            <div class="map-info-item">
                <span class="map-info-label" data-i18n="label_map"></span>
                <span id="mapName" class="map-info-value">Canyon</span>
            </div>
            <div class="map-info-item">
                <span class="map-info-label" data-i18n="label_date"></span>
                <span id="mapDate" class="map-info-value">2026-02-06</span>
            </div>
        </div>



        <div id="pauseOverlay" class="pause-overlay" style="display: none;" aria-live="polite">
            <div class="pause-content">
                <div id="pauseTitle" class="pause-title">Pause</div>
                <div id="pauseTime" class="pause-time">00:00</div>
                <button id="resumeBtn" class="resume-btn">▶ Resume</button>
            </div>
        </div>

        <div class="controls">
            <button id="resetBtn" data-i18n="btn_reset"></button>
            <div class="wall-counter">
                <span class="counter-label" data-i18n="label_walls_placed"></span>
                <span id="wallCounter" class="counter-value">0 / 9</span>
            </div>
            <div class="area-size-display">
                <span class="counter-label" data-i18n="label_area_size"></span>
                <span id="areaSize" class="counter-value">∞</span>
            </div>
            <button id="timerBtn" class="timer-btn" data-i18n-title="timer_pause_title" data-i18n-aria="timer_pause_aria" title="Pause timer" aria-label="Pause timer">
                <span id="timerValue" class="timer-value">00:00</span>
                <span id="timerIcon" class="timer-icon" aria-hidden="true">⏸</span>
            </button>
            <button id="hintCheckBtn" class="hint-check-btn" style="display: none;" disabled
                    data-i18n-title="hint_check_title_disabled" data-i18n-aria="hint_check_aria"
                    title="Pen the pet first to check your solution" aria-label="Check if optimal">
                <span class="hint-check-label" data-i18n="hint_check_label"></span>
            </button>
            <button class="penned-status not-penned" id="pennedStatus"
                    data-i18n-title="status_cant_escape"
                    title="Pet can still escape - keep building walls!"
                    data-interactive="false">
                <span class="submit-label" data-i18n="status_unsolved"></span><span class="submit-check">✗</span>
            </button>
        </div>

        <div id="notification" class="notification"></div>

        <div id="solutionToggleBar" class="solution-toggle-bar" style="display: none;">
            <span id="solutionViewLabel" class="solution-view-label" data-i18n="solution_viewing_yours"></span>
            <button id="solutionToggleBtn" class="solution-toggle-btn" data-i18n-aria="solution_toggle_aria" aria-label="Toggle between your solution and optimal result" data-i18n="solution_toggle_view_optimal"></button>
        </div>

        <aside id="roamSpaceViewer" class="roam-viewer-sidebar">
            <article class="viewer-card">
                <header class="viewer-header" data-i18n="viewer_header"></header>
                <section class="metrics-display">
                    <label class="metric-label" data-i18n="metric_label_roaming"></label>
                    <output class="metric-value" id="roamAreaMetric">0</output>
                    <small class="metric-percentage" id="roamAreaPercentage"></small>
                    <small class="metric-helper" data-i18n="metric_helper"></small>
                </section>
                <footer class="viewer-footer">
                    <button id="shareScoreBtn" class="share-score-btn" data-i18n="btn_copy_score"></button>
                    <button id="exitViewer" class="exit-viewer-btn" data-i18n="btn_back_to_game"></button>
                </footer>
            </article>
        </aside>

        <div class="grid-container">
            <div id="grid" class="grid"></div>
        </div>

        <div id="hintUsedDisplay" class="hint-used-display" style="display: none;"></div>

        <div class="best-state-wrapper">
            <button id="bestStateBanner" class="best-state-banner" disabled style="display: none;">
                <span class="best-state-label" data-i18n="best_so_far_none"></span>
            </button>
        </div>

        <div class="debug-section" style="display: none;">
            <h3 data-i18n="debug_heading"></h3>
            <div class="debug-content">
                <div class="debug-item">
                    <label for="debugShowAllLevels">
                        <input type="checkbox" id="debugShowAllLevels">
                        <span data-i18n="debug_show_all_levels"></span>
                    </label>
                    <small class="option-help" data-i18n="debug_show_all_levels_help"></small>
                </div>
                <div class="debug-item">
                    <button id="debugResetLevel" data-i18n="debug_reset_level"></button>
                </div>
                <div class="debug-item">
                    <button id="debugResetAll" data-i18n="debug_reset_all"></button>
                </div>
            </div>
        </div>

        <footer>
            <p data-i18n-html="about_credits_1"></p>
            <p><a id="githubFooterLink" href="https://github.com/AvinZarlez/penthepet" target="_blank" rel="noopener noreferrer" data-i18n="footer_view_github"></a></p>
        </footer>
    </div>

    <!-- Menu Modal -->
    <div id="menuModal" class="modal">
        <div class="modal-content menu-modal-content">
            <button class="modal-close" data-i18n-aria="menu_close_aria" aria-label="Close menu">&times;</button>
            <h2 data-i18n="menu_title"></h2>
            <div class="menu-options">
                <button id="levelSelectorBtn" class="menu-option-btn" data-i18n="btn_level_selector"></button>
                <button id="instructionsBtn" class="menu-option-btn" data-i18n="btn_instructions"></button>
                <button id="aboutBtn" class="menu-option-btn" data-i18n="btn_about"></button>
                <button id="optionsBtn" class="menu-option-btn" data-i18n="btn_options"></button>
            </div>
        </div>
    </div>

    <!-- Level Selector Modal -->
    <div id="levelSelectorModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" data-i18n-aria="level_selector_close_aria" aria-label="Close level selector">&times;</button>
            <h2 data-i18n="level_selector_title"></h2>
            <p class="modal-description" data-i18n="level_selector_description"></p>
            <div id="levelList" class="level-list">
                <!-- Levels will be populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Instructions Modal -->
    <div id="instructionsModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" data-i18n-aria="instructions_close_aria" aria-label="Close instructions">&times;</button>
            <h2 data-i18n="instructions_title"></h2>
            <div class="modal-section">
                <h3 data-i18n="instructions_objective_heading"></h3>
                <p data-i18n="instructions_objective_text"></p>
            </div>
            <div class="modal-section">
                <h3 data-i18n="instructions_gameplay_heading"></h3>
                <div id="tileDescriptions" class="tile-descriptions"></div>
            </div>
            <div class="modal-section">
                <h3 data-i18n="instructions_scoring_heading"></h3>
                <ul>
                    <li data-i18n="instructions_scoring_1"></li>
                    <li data-i18n="instructions_scoring_2"></li>
                    <li data-i18n="instructions_scoring_3"></li>
                    <li data-i18n="instructions_scoring_4"></li>
                    <li data-i18n-html="instructions_scoring_5"></li>
                    <li data-i18n="instructions_scoring_6"></li>
                </ul>
            </div>
            <div class="modal-section">
                <h3 data-i18n="instructions_hints_heading"></h3>
                <ul>
                    <li data-i18n-html="instructions_hints_1"></li>
                    <li data-i18n="instructions_hints_2"></li>
                    <li data-i18n-html="instructions_hints_3"></li>
                    <li data-i18n-html="instructions_hints_4"></li>
                </ul>
            </div>
            <div class="modal-section">
                <h3 data-i18n="instructions_options_heading"></h3>
                <p data-i18n="instructions_options_text"></p>
            </div>
        </div>
    </div>

    <!-- About Modal -->
    <div id="aboutModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" data-i18n-aria="about_close_aria" aria-label="Close about">&times;</button>
            <h2 data-i18n="about_title"></h2>
            <div class="modal-section">
                <p data-i18n-html="about_description_1"></p>
                <p data-i18n="about_description_2"></p>
            </div>
            <div class="modal-section">
                <h3 data-i18n="about_features_heading"></h3>
                <ul>
                    <li data-i18n="about_features_1"></li>
                    <li data-i18n="about_features_2"></li>
                    <li data-i18n="about_features_3"></li>
                    <li data-i18n="about_features_4"></li>
                    <li data-i18n="about_features_5"></li>
                </ul>
            </div>
            <div class="modal-section">
                <h3 data-i18n="about_feedback_heading"></h3>
                <p data-i18n-html="about_feedback_text"></p>
            </div>
            <div class="modal-section">
                <h3 data-i18n="about_credits_heading"></h3>
                <p data-i18n-html="about_credits_1"></p>
                <p><a id="githubProjectLink" href="https://github.com/AvinZarlez/penthepet" target="_blank" rel="noopener noreferrer" data-i18n="about_view_github"></a></p>
                <p><a href="PRIVACY_POLICY.md" target="_blank" rel="noopener noreferrer" data-i18n="about_privacy_policy"></a></p>
                <p data-i18n="about_copyright"></p>
            </div>
        </div>
    </div>

    <!-- Options Modal -->
    <div id="optionsModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" data-i18n-aria="options_close_aria" aria-label="Close options">&times;</button>
            <h2 data-i18n="options_title"></h2>
            <div class="modal-section">
                <div class="option-item">
                    <label for="modalPetType" data-i18n="options_pet_type_label"></label>
                    <select id="modalPetType">
                        <!-- Options populated dynamically from CONSTANTS.ANIMAL_OPTIONS -->
                    </select>
                </div>
                <div class="option-item">
                    <label for="modalHintsDisabled">
                        <input type="checkbox" id="modalHintsDisabled">
                        <span data-i18n="options_hints_disabled_label"></span>
                    </label>
                </div>
                <div class="option-item" id="neverShowTargetOptionItem">
                    <label for="modalNeverShowTarget">
                        <input type="checkbox" id="modalNeverShowTarget">
                        <span data-i18n="options_never_show_target_label"></span>
                    </label>
                </div>
                <div class="option-item">
                    <label for="modalTimezone" data-i18n="options_timezone_label"></label>
                    <select id="modalTimezone">
                        <!-- Options populated dynamically from CONSTANTS.TIMEZONE_OPTIONS -->
                    </select>
                    <small class="option-help" data-i18n="options_timezone_help"></small>
                </div>
                <div class="option-item" id="debugModeOptionItem" style="display: none;">
                    <label for="debugModeCheckbox">
                        <input type="checkbox" id="debugModeCheckbox">
                        <span data-i18n="options_debug_mode_label"></span>
                    </label>
                    <small class="option-help" data-i18n="options_debug_mode_help"></small>
                </div>
            </div>
            <div id="optionsAccountSection" class="modal-section options-account-section" style="display: none;">
                <h3 data-i18n="options_account_heading"></h3>
                <div id="optionsAccountSignedOut">
                    <button class="options-account-btn" data-i18n="options_sign_in_to_sync" onclick="CloudSync.openAuthModal()"></button>
                </div>
                <div id="optionsAccountSignedIn" style="display: none;">
                    <p class="options-account-info"><span data-i18n="options_signed_in_as"></span> <strong id="optionsUsername"></strong></p>
                    <div class="options-account-buttons">
                        <button class="options-account-btn" data-i18n="options_edit_profile" onclick="CloudSync.openEditProfileModal()"></button>
                        <button class="options-account-btn options-account-signout" data-i18n="options_sign_out" onclick="CloudSync.handleSignOut()"></button>
                        <button class="options-account-btn" data-i18n="options_download_my_data" onclick="CloudSync.handleDownloadMyData()"></button>
                        <button class="options-account-btn options-account-delete" data-i18n="options_delete_cloud_data" onclick="CloudSync.handleDeleteAllCloudData()"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="modal">
        <div class="modal-content cloud-sync-modal-content">
            <button class="modal-close" data-i18n-aria="edit_profile_close_aria" aria-label="Close edit profile" onclick="CloudSync.closeEditProfileModal()">&times;</button>
            <h2 data-i18n="edit_profile_title"></h2>
            <p class="modal-description" data-i18n="edit_profile_description"></p>
            <div class="auth-form">
                <label for="profileUsername" data-i18n="edit_profile_username_label"></label>
                <input type="text" id="profileUsername" class="auth-input" data-i18n-placeholder="edit_profile_username_placeholder" placeholder="Your display name" autocomplete="username">
                <label for="profileEmail" data-i18n="edit_profile_email_label"></label>
                <input type="email" id="profileEmail" class="auth-input" data-i18n-placeholder="edit_profile_email_placeholder" placeholder="you@example.com" autocomplete="email">
                <div class="profile-linked-accounts">
                    <p class="profile-section-label" data-i18n="edit_profile_connected_heading"></p>
                    <div class="linked-account-row">
                        <span class="linked-account-name" data-i18n="edit_profile_google"></span>
                        <button id="linkGoogleBtn" class="auth-btn auth-btn-secondary auth-btn-sm" data-i18n="edit_profile_connect" onclick="CloudSync.handleLinkWithGoogle()"></button>
                    </div>
                </div>
                <div id="profileError" class="auth-error" style="display: none;"></div>
                <div id="profileSuccess" class="profile-success" style="display: none;"></div>
                <div class="auth-buttons">
                    <button id="profileSaveBtn" class="auth-btn auth-btn-primary" data-i18n="edit_profile_save" onclick="CloudSync.handleSaveProfile()"></button>
                    <button class="auth-btn auth-btn-secondary" data-i18n="edit_profile_cancel" onclick="CloudSync.closeEditProfileModal()"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cloud Sync Auth Modal -->
    <div id="cloudSyncModal" class="modal">
        <div class="modal-content cloud-sync-modal-content">
            <button class="modal-close" data-i18n-aria="cloud_sync_modal_close_aria" aria-label="Close sign in" onclick="CloudSync.closeAuthModal()">&times;</button>
            <h2 data-i18n="cloud_sync_modal_title"></h2>
            <p class="modal-description" data-i18n="cloud_sync_modal_description"></p>
            <div class="auth-form">
                <button id="authGoogleBtn" class="auth-oauth-btn auth-oauth-google" onclick="CloudSync.handleSignInWithGoogle()">
                    <span class="auth-oauth-icon" aria-hidden="true">G</span> <span data-i18n="cloud_sync_sign_in_google"></span>
                </button>
                <div class="auth-divider"><span data-i18n="cloud_sync_or_email"></span></div>
                <label for="authEmailLink" data-i18n="cloud_sync_email_label"></label>
                <input type="email" id="authEmailLink" class="auth-input" data-i18n-placeholder="cloud_sync_email_placeholder" placeholder="you@example.com" autocomplete="email">
                <div id="authLinkError" class="auth-error" style="display: none;"></div>
                <div id="authLinkSuccess" class="profile-success" style="display: none;"></div>
                <button id="authSendLinkBtn" class="auth-btn auth-btn-primary" data-i18n="cloud_sync_send_link" onclick="CloudSync.handleSendSignInLink()"></button>
            </div>
        </div>
    </div>

    <!-- Sync Error Modal -->
    <div id="syncErrorModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" data-i18n-aria="sync_error_close_aria" aria-label="Close sync error">&times;</button>
            <h2 data-i18n="sync_error_title"></h2>
            <p data-i18n="sync_error_text"></p>
            <pre id="syncErrorMessage" class="sync-error-details"></pre>
            <p data-i18n-html="sync_error_contact_html"></p>
        </div>
    </div>

    <!-- Firebase SDK (compat) — loaded only when needed; CloudSync/Analytics gracefully no-op if missing -->
    <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-analytics-compat.js"></script>

    <!-- Game Scripts (Load in order: constants -> config -> types -> utils -> pathfinding -> grid -> firebase-config -> migration -> cloud -> analytics -> game -> menu -> main) -->
    <script src="js/constants.js"></script>
    <script src="js/config.js"></script>
    <script src="js/tileData.js"></script>
    <script src="js/tileTypes.js"></script>
    <script src="js/CookieUtils.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/DateUtils.js"></script>
    <script src="js/PathfindingUtils.js"></script>
    <script src="js/Grid.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/CloudMigration.js"></script>
    <script src="js/CloudSync.js"></script>
    <script src="js/Analytics.js"></script>
    <script src="js/Game.js"></script>
    <script src="js/Menu.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
